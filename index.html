
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Aryan App Maker | Pro, Max & Pro Max</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500&family=Inter:wght@100;200;300;400;500;600;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #050505;
      color: #f8fafc;
      margin: 0;
      overflow: hidden;
    }
    .font-rock {
      font-family: 'Syncopate', sans-serif;
    }
    .font-mono {
      font-family: 'Fira Code', monospace;
    }
    .luxury-glass {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    
    /* ROCKSTAR EFFECTS */
    .spotlight {
      background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, transparent 70%);
      filter: blur(60px);
      pointer-events: none;
    }
    .neon-pulse {
      animation: neon-pulse 2s infinite alternate;
    }
    @keyframes neon-pulse {
      from { box-shadow: 0 0 10px rgba(168, 85, 247, 0.2), 0 0 20px rgba(168, 85, 247, 0.1); }
      to { box-shadow: 0 0 30px rgba(168, 85, 247, 0.5), 0 0 60px rgba(168, 85, 247, 0.3); }
    }
    .chrome-text {
      background: linear-gradient(to bottom, #fff 0%, #cbd5e1 45%, #64748b 50%, #94a3b8 55%, #fff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }
    .stage-flicker {
      animation: stage-flicker 4s infinite;
    }
    @keyframes stage-flicker {
      0%, 100% { opacity: 0.1; }
      50% { opacity: 0.3; }
      52% { opacity: 0.1; }
      54% { opacity: 0.4; }
      56% { opacity: 0.1; }
    }

    /* LUXURY SCROLLBAR */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(to bottom, #fbbf24, #d97706);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 10px rgba(251, 191, 36, 0.2);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(to bottom, #fde68a, #fbbf24);
    }

    /* ROCKSTAR SCROLLBAR */
    .rockstar-scroll::-webkit-scrollbar {
      width: 8px;
    }
    .rockstar-scroll::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 10px;
    }
    .rockstar-scroll::-webkit-scrollbar-thumb {
      background: linear-gradient(to bottom, #a855f7, #ec4899);
      border-radius: 10px;
      border: 2px solid rgba(0, 0, 0, 0.4);
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
    }
    .rockstar-scroll::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(to bottom, #c084fc, #f472b6);
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.6);
    }

    /* Modal Specific Scrollbar */
    .modal-scroll::-webkit-scrollbar-thumb {
      background: linear-gradient(to bottom, #e2e8f0, #cbd5e1);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
    }
    
    /* Feature List Scrollbar */
    .feature-scroll::-webkit-scrollbar {
      width: 3px;
    }
    .feature-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border: none;
    }
    .feature-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.4);
    }
  </style>
